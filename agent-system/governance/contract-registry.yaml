registry_version: "1.0.0"
project_id: applyvault

contracts:
  - id: api-rest-controllers
    status: APPROVED_EXISTING
    description: ASP.NET Controllers under api/* route prefixes
    owner: backend-engineer
    evidence: api/ApplyVault.Api/Controllers/

  - id: scrape-ingest
    status: APPROVED_EXISTING
    description: Extension POST scrape-results with Bearer JWT
    owner: backend-engineer
    secondary: browser-extension-engineer
    evidence: ScrapeResultsController; extension aspNetApiClient

  - id: supabase-jwt
    status: APPROVED_EXISTING
    description: Supabase JWKS JWT Bearer validation
    owner: backend-engineer
    evidence: ConfigureSupabaseJwtBearerOptions.cs

  - id: cv-section-catalog
    status: APPROVED_EXISTING
    description: Declarative section schema catalog
    owner: backend-engineer
    secondary: frontend-engineer
    evidence: shared/cv-section-catalog/cv-section-catalog.json; ADR-0001

  - id: structured-cv-fields-json
    status: APPROVED_EXISTING
    description: Entry FieldsJson validated against catalog
    owner: backend-engineer
    evidence: ADR-0001

  - id: eures-jobnet-search
    status: APPROVED_EXISTING
    description: >
      Public job search APIs and ranked caches. EURES additive filters
      (sort allowlist, publicationPeriod, positionScheduleCodes) per ADR-0014 / #6.
    owner: backend-engineer
    evidence: Services/Eures; Services/Jobnet; docs/adr/0014-eures-public-search-filters.md

  - id: google-ai-gemini-http
    status: APPROVED_EXISTING
    description: Gemini generateContent HTTP clients and feature toggles
    owner: ai-llm-engineer
    evidence: GoogleAi* services; GoogleAi options

  - id: oauth-integrations
    status: APPROVED_EXISTING
    description: Gmail, Google/Microsoft calendar, GitHub OAuth connections
    owner: backend-engineer
    evidence: Mail/Calendar/GitHub controllers and services

  - id: health-endpoints
    status: APPROVED_EXISTING
    description: /health, /health/live, api/health
    owner: platform-engineer
    secondary: backend-engineer
    evidence: WebApplicationExtensions; HealthController

  - id: interview-prep-v2-sessions
    status: APPROVED
    description: >
      Interview Prep v2 session lifecycle REST under /api/interview-prep/*
      (create, prepare, start, pause, resume, cancel, complete, turns).
      Immutable CV/job snapshots; app-owned state machines; Loop Guard.
      Answer review (POST .../turns/{turnId}/review|retry) wire includes modelAnswer;
      coachingFeedback deprecated for UI. Answer-review AI uses GenerateAnswerReview
      (CV/job grounded); session-report GenerateFeedback remains separate. ADR-0021;
      ADR-0026.
    owner: backend-engineer
    secondary: ai-llm-engineer
    evidence: >
      docs/adr/0021-interview-prep-v2-bounded-module.md;
      docs/adr/0026-interview-prep-answer-review-model-answer.md;
      api/ApplyVault.Api/Controllers/InterviewPrepController.cs;
      api/ApplyVault.Api/Services/InterviewPrep/

  - id: interview-prep-briefs
    status: APPROVED
    description: >
      Durable Interview Prep brief REST under /api/interview-prep/briefs
      (generate, regenerate, list, get, delete). Independent of sessions.
      Topics nest coverageItems (≥1), sampleQuestions, talkingPoints
      (sibling lists; one nesting level). Brief topic gap on topic only;
      Language/Market as sessions; outdated labels; no version history;
      no session seed. ADR-0025 amended body.
    owner: backend-engineer
    secondary: ai-llm-engineer
    evidence: >
      docs/adr/0025-interview-prep-brief.md;
      agent-system/handoffs/active/interview-prep-brief-nested-2026-08-05/frozen-contracts.md;
      api/ApplyVault.Api/Services/InterviewPrep/InterviewPrepStudyBriefService.cs;
      api/ApplyVault.Api/Controllers/InterviewPrepController.cs;
      frontend/applyvault-jobs-ui/src/app/features/interview-prep/

proposed_contracts: []

