    owner: backend-engineer
    secondary: ai-llm-engineer
    evidence: >
      docs/adr/0012-interview-prep-ephemeral-profession-agnostic.md;
      docs/adr/0013-interview-prep-hiring-market.md;
      docs/adr/0015-interview-prep-model-answer-reveal.md;
      docs/adr/0016-interview-prep-durable-session-history.md;
      agent-system/handoffs/archive/interview-prep-ip-01-2026-08-02/frozen-contracts.md;
      api/ApplyVault.Api/Controllers/InterviewPrepController.cs;
      api/ApplyVault.Api/Services/InterviewPrep/

  - id: interview-prep-sessions
    status: APPROVED
    description: >
      Durable Interview Prep session history (list / get / create / delete)
      plus optional sessionId on turns. Supersedes ADR-0012 §1 only.
      ADR-0016 Accepted 2026-08-03 / GitHub #79 IP-13.
    owner: backend-engineer
    secondary: frontend-engineer
    evidence: >
      docs/adr/0016-interview-prep-durable-session-history.md;
      api/ApplyVault.Api/Controllers/InterviewPrepController.cs;
      api/ApplyVault.Api/Data/InterviewPrepSessionEntity.cs;
      frontend/applyvault-jobs-ui/src/app/features/interview-prep/;
      https://github.com/PrimusInterParess/ApplyVault/issues/79

