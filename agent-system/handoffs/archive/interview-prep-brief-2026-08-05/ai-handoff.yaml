# --- AI contract for backend T6 ---
ai_operation:
  enum: GenerateInterviewPrepStudyBrief
  gateway_method: GenerateInterviewPrepStudyBriefAsync
  prompt_name: interview-prep.generate-study-brief
  prompt_version: "2026-08-05.1"
  schema_location: >
    api/ApplyVault.Api/Services/InterviewPrep/Ai/GoogleAiInterviewPrepResponseSchemas.cs
    (GenerateInterviewPrepStudyBriefSchema)
  hard_fail: true
  safe_fallback: null
  options: >
    Reuses existing InterviewPrep:Ai (Enabled, UseFakeProvider, TimeoutSeconds,
    MaxRetries, RetryDelayMilliseconds, AllowSafeFallback). No new keys.
    Live path also requires GoogleAi:Enabled + GoogleAi:ApiKey (ADR-0008).

request_type: GenerateInterviewPrepStudyBriefRequest
request_fields:
  - Language: string (wire english|danish|mixedEnglishDanish)
  - Market: string (wire general|danish)
  - FocusNote: string|null
  - CvSnapshot: InterviewPrepAiDocumentSnapshot
  - JobSnapshot: InterviewPrepAiDocumentSnapshot|null

response_type: GenerateInterviewPrepStudyBriefResponse
response_fields:
  - topics: InterviewPrepAiStudyBriefTopic[] (name, gap, priority, note?)
  - sampleQuestions: InterviewPrepAiStudyBriefItem[] (text, note?)
  - talkingPoints: InterviewPrepAiStudyBriefItem[] (text, note?)
gap_wire_values:
  - alreadyStrong
  - mustStudy
  - niceToHave
  - unclear

fake_provider_behavior: >
  FakeDeterministicInterviewPrepAiProvider returns a fixed valid structured body:
  profession-agnostic topics (motivation/fit, ownership/outcomes, domain methods —
  not software stacks); gaps mix alreadyStrong/mustStudy/niceToHave/unclear;
  priorities contiguous from 1; sampleQuestions + talkingPoints with text.
  Adds a mustStudy focus topic when FocusNote present; marks unclear when CV text empty.

naming_note: >
  Architecture suggested GenerateInterviewPrepBrief; implemented
  GenerateInterviewPrepStudyBrief to distinguish from session CreateInterviewBrief
  and align with InterviewPrepStudyBrief* CLR naming (frozen-contracts §0).
