# --- AI contract delta for backend / Principal ---
ai_operation:
  enum: GenerateInterviewPrepStudyBrief
  gateway_method: GenerateInterviewPrepStudyBriefAsync
  prompt_name: interview-prep.generate-study-brief
  prompt_version: "2026-08-05.2"
  schema_location: >
    api/ApplyVault.Api/Services/InterviewPrep/Ai/GoogleAiInterviewPrepResponseSchemas.cs
    (GenerateInterviewPrepStudyBriefSchema)
  hard_fail: true
  safe_fallback: null

response_type: GenerateInterviewPrepStudyBriefResponse
response_root_fields:
  - topics: InterviewPrepAiStudyBriefTopic[] (min 1)

topic_fields:
  - name: string
  - gap: alreadyStrong|mustStudy|niceToHave|unclear
  - priority: int >= 1 (unique within brief)
  - note: string|null
  - coverageItems: InterviewPrepAiStudyBriefItem[] (min 1)
  - sampleQuestions: InterviewPrepAiStudyBriefItem[] (may be empty)
  - talkingPoints: InterviewPrepAiStudyBriefItem[] (may be empty)

item_fields:
  - text: string (required, non-empty after trim)
  - note: string|null

removed_from_ai_root:
  - sampleQuestions
  - talkingPoints

validator_rules:
  - topics non-null and length >= 1
  - each topic: name, valid gap, priority >= 1, unique priorities
  - each topic: coverageItems non-null length >= 1; each text non-empty
  - each topic: sampleQuestions/talkingPoints non-null arrays (may be []); each present text non-empty
