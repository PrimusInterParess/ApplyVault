  - "2. backend-engineer — migration + session store + endpoints + durable turns"
  - "3. frontend-engineer — history UI + create/resume/read-only/delete binding"
  - "4. code-review-engineer → qa-engineer against #79 AC"
  - "5. Close: mark ADR Accepted; registry interview-prep-sessions APPROVED"

approval_gates:
  - Principal accepts docs/adr/0016-interview-prep-durable-session-history.md before backend coding

open_questions:
  - id: OQ-1
    severity: non_blocking
    question: >
      Durable turns should prefer session-owned mode/languageMix/hiringMarket/scrape
      over client request fields (recommended). Confirm session-wins vs 400-on-mismatch.
    recommendation: session_wins_ignore_client_overrides
  - id: OQ-2
    severity: non_blocking
    question: >
      After IP-13 FE ships, keep exposing ephemeral turns in UI (not recommended)
      or always create sessions?
    recommendation: FE always durable; API keeps ephemeral for compat
  - id: OQ-3
    severity: non_blocking
    question: Exact max messages per session default (suggested 200).
    recommendation: 200_via_options

validation:
  - "Design-only pass; no builds/tests executed"
  - "Issue #79 AC mapped to endpoints + retention + CV non-mutation"
  - "ADR-0012 §1 supersession explicit; §2–8 preserved"

risks:
  - "Abandoned in_progress sessions clutter list until user deletes"
  - "Storage growth of full transcripts; abuse cap required"
  - "Scrape deleted after session → list still shows JobTitle/CompanyName snapshot; ScrapeResultId null"
  - "ADR still Proposed — implementers must not start until Principal accepts"

boundary_ip15_notes: >
  IP-15 prep notes and #44 saved-job notes remain separate; not stored on
  Interview Prep session messages.

