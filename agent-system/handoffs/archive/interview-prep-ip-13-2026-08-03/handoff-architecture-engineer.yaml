from_agent: architecture-engineer
to_agent: principal-software-architect
status: READY
completed_at: "2026-08-03"
parent_request: >
  IP-13 / GitHub #79 — durable Interview Prep session history
  (list / resume / read-only completed / user delete).
objective: design
summary: >
  Designed durable per-user Interview Prep sessions that supersede ADR-0012 §1
  only. Recommended: EF InterviewPrepSession + InterviewPrepSessionMessage,
  session CRUD under /api/interview-prep/sessions, additive optional sessionId
  on POST /turns (server-sourced priorTurns when set; ephemeral path kept).
  Completed = phase debrief; resume in_progress; hard-delete retention MVP.
  ADR-0016 Proposed; frozen contracts written. No application feature code.

## Architecture design summary
request: redesign
recommendation: >
  Additive durable sessions on dedicated interview-prep API + EF SQL Server;
  keep ephemeral turns without sessionId for compatibility.

current_state:
  - "Sole coach endpoint POST /api/interview-prep/turns (InterviewPrepController)"
  - "DTOs in Models/InterviewPrepContracts.cs; service loads CV ± owned scrape, calls Gemini"
  - "No Interview Prep DbSets in ApplyVaultDbContext"
  - "FE InterviewPrepFacade holds messages/priorTurns/scorecard in signals; resetSession clears; refresh loses history"
  - "ADR-0012 §1 explicitly deferred durable history to IP-13"

target_state:
  - "InterviewPrepSession + InterviewPrepSessionMessage entities, UserId tenancy (ADR-0010)"
  - "POST/GET/DELETE /api/interview-prep/sessions (+ GET by id with messages)"
  - "POST /turns? sessionId optional — durable append + complete on debrief"
  - "FE history list + read-only completed + resume in_progress + delete"
  - "Full transcript stored; AI still capped via MaxPriorTurns"

options_considered:
  recommended: >
    Normalized session + messages; additive sessionId on turns; hard delete;
    job title/company snapshots for list
  rejected:
    - "JSON-blob-only transcript — weaker append/resume"
    - "Redis durable cache — not product persistence"
    - "Remove ephemeral path immediately — out of scope redesign"
    - "Soft-delete — hard delete clearer for chat MVP privacy"

