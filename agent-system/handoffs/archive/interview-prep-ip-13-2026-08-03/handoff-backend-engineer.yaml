  IP-13 / GitHub #79 — durable Interview Prep session history
  (EF sessions + messages, CRUD, durable POST /turns).
objective: implement
summary: >
  Implemented InterviewPrepSession + InterviewPrepSessionMessage persistence,
  session CRUD under /api/interview-prep/sessions, and durable POST /turns with
  optional sessionId (session-wins; priorTurns from DB; complete on debrief → 409;
  MaxMessagesPerSession=200). Ephemeral turns without sessionId unchanged.
  Migration AddInterviewPrepSessions added. No tests run (user policy).
  CR-IP-13-01 fixed: durable turns update LatestScorecardJson/LatestOverallScore
  only when response.Scorecard is non-null (do not clear prior denorm on null).

## Verified facts
- Existing sole endpoint was POST /api/interview-prep/turns (ephemeral).
- ADR-0016 Accepted with OQ defaults (session-wins, max 200, keep ephemeral).
- Tenancy via GetRequiredUserAsync + UserId filters; scrape FK ON DELETE SET NULL.

## Decisions applied
- session-wins: ignore client mode/languageMix/hiringMarket/scrapeResultId/priorTurns when sessionId set
- Complete when durable response phase=debrief; further turns → 409 Conflict
- Hard delete session (+ cascade messages)
- Message cap: reject when messageCount + 2 > MaxMessagesPerSession (default 200)
- Response echoes sessionId on durable turns; null/omit on ephemeral

