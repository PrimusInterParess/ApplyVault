## FE contract summary
endpoints:
  - POST /api/interview-prep/sessions → 201 InterviewPrepSessionSummaryDto
  - GET /api/interview-prep/sessions?take&skip → 200 { items, totalCount }
  - GET /api/interview-prep/sessions/{id} → 200 detail + ordered messages
  - DELETE /api/interview-prep/sessions/{id} → 204 hard delete
  - POST /api/interview-prep/turns + sessionId → durable append; echo sessionId
  - POST /api/interview-prep/turns without sessionId → ephemeral (unchanged)
errors:
  - 404 missing/foreign session or scrape (create) / missing CV
  - 409 turn on completed session
  - 400 invalid enums, empty userMessage, message cap
options:
  - InterviewPrepAi:MaxMessagesPerSession default 200

## Validation
  - Code + migration only; no dotnet build/restore/test (user policy)
  - Principal / QA to validate later

## Security
  - [Authorize] + GetRequiredUserAsync
  - All session queries filter UserId == user.Id
  - No CV / scrape mutation from prep path

## Residual risks
  - Hand-written EF Designer/snapshot not verified via `dotnet ef` / build
  - Abandoned in_progress sessions remain until user deletes
  - Soft-deleted scrape on durable turn → job context omitted (snapshots remain on session)

