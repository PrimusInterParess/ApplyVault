summary: >
  Bound /interview-prep to durable sessions. Start practice creates a session
  then posts turns with sessionId. History panel lists date/mode/optional job/
  status; open resumes in_progress or loads completed read-only (no composer);
  delete confirms then hard-deletes. Subtitle no longer claims ephemeral-only.
  CV gate, mode/language/market chips, scorecard, and modelAnswer reveal kept.

## Verified facts
- Backend READY: sessions CRUD + durable POST /turns with sessionId (session-wins).
- Existing FE held all chat state ephemerally via facade signals.
- Product path is always-durable after ship; ephemeral turns unused by UI.

## Decisions applied
- createSession before bootstrap "Let's start." turn; every turn includes sessionId
- History on setup view; open GET detail hydrates messages/scorecard/phase
- completed / debrief ⇒ isReadOnly (composer + follow-up insert hidden)
- Hard delete via API after window.confirm
- Bootstrap user line still hidden in chat when hydrating

