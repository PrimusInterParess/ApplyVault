  non_blocking:
    - id: CR-IP-M1-01
      severity: should-fix
      confidence: medium
      path: api/ApplyVault.Api/Services/InterviewPrep/GoogleAiInterviewPrepClient.cs
      hunk: "response.EnsureSuccessStatusCode(); + JsonSerializer.Deserialize"
      rationale: >
        Gemini HTTP failure throws HttpRequestException; bad JSON throws
        JsonException. Controller only maps KeyNotFound→404 and
        InvalidOperation→400, so these can surface as 500. Frozen contracts
        prefer Gemini/parse → 400. House-consistent with sibling GoogleAi*
        clients (evaluation/export/etc.) — not M1-unique; fix only if Principal
        wants a fleet-wide wrap pattern.
    - id: CR-IP-M1-02
      severity: nit
      confidence: high
      path: api/ApplyVault.Api.Tests/InterviewPrepServiceTests.cs
      rationale: >
        Service-layer coverage is strong for mode/languageMix/empty message/
        missing CV/empty sections/foreign scrape/disabled AI/no-save. No
        controller or WebApplicationFactory test asserts HTTP 401/404/400
        status codes; thin controller mirrors CvDocuments AI endpoints so
        gap is low risk.
    - id: CR-IP-M1-03
      severity: nit
      confidence: high
      path: api/ApplyVault.Api/Services/InterviewPrep/GoogleAiInterviewPrepClient.cs
      hunk: ResolveLanguageMix
      rationale: >
        API service correctly rejects languageMix en+da (frozen). Client
        soft-maps en+da→mixed and falls back unknown→default/en. Defense in
        depth is fine; asymmetry is harmless as long as service stays the
        public gate.
    - id: CR-IP-M1-04
      severity: nit
      confidence: medium
      path: api/ApplyVault.Api/Services/InterviewPrep/InterviewPrepService.cs
      hunk: NormalizePriorTurns
      rationale: >
        priorTurns.role/phase validation exists but lacks dedicated unit tests
        (invalid role/phase → InvalidOperation). Non-critical coverage gap.
    - id: CR-IP-M1-05
      severity: nit
      confidence: high
      path: api/ApplyVault.Api/Options/InterviewPrepAiOptions.cs
      hunk: DefaultSystemPrompt (~line with "never default to software engineer")
      rationale: >
        Minor mid-sentence lowercase / grammar glitch in default system prompt;
        does not weaken profession-agnostic rules. Comment-level polish only.

