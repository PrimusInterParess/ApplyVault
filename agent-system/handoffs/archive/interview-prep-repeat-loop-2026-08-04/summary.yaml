schema_version: "1.0.0"
task_id: interview-prep-repeat-loop-2026-08-04
closed_at: "2026-08-04"
integration_status: REQUEST_COMPLETE_WITH_DOCUMENTED_LIMITATIONS
parent_request: >
  User reported the Interview Prep coach was again in a repeating question
  loop, re-asking for elaboration/support/stakeholder details after the user
  had already answered.
final_status_notes: >
  AI/LLM diagnosis classified the symptom as an answered-question/topic-stall
  rather than an exact duplicate. Backend extended the existing
  GenerateTurnWithDuplicateGateAsync retry path with a deterministic,
  profession-agnostic lexical stall check over recent coach(interview) ->
  user(non-empty) pairs plus the current user message. Exact duplicate retry
  remains first; stall retry reuses MaxCoachDuplicateRetries and sends a
  targeted corrective nudge. Code review returned APPROVE WITH NITS.
durable_artifacts:
  - api/ApplyVault.Api/Services/InterviewPrep/InterviewPrepService.cs
agents:
  - ai-llm-engineer
  - backend-engineer
  - code-review-engineer
limitations:
  - No builds or tests were run by request constraints.
  - Lexical stall detection is conservative; low-overlap semantic repeats can still pass.
  - Legitimate narrow follow-ups can be retried if they heavily reuse answered prompt wording.
  - If InterviewPrepAi:MaxCoachDuplicateRetries is configured to 0, both exact duplicate and stall retries are disabled.
