    - InterviewPrepOperationalCatalog create gate on InterviewPrepSessionService
    - Mode/persona competency priorities and SeniorPeer questionStyleHint peer_technical_depth
    - Planner + context builder inject roleDepth when job snapshot present
    - FixedInterviewPrepQuestionBank for all operational mode×persona pairs (12 combos)
    - Fake provider brief/plan/message personaStyle and tone markers for tests
    - Prompt registry bump generate-interviewer-message to 2026-08-05.2
    - Unit + integration tests for M7 behavior
  excluded:
    - M8 ProblemSolvingCase operational surface
    - M9 language/market expansion
    - M10 full loop
    - ADR edits
    - Frontend
    - Gateway/transport rebuild

decisions:
  - unfinished_enums: present on wire for forward compatibility; rejected at create via operational catalog
  - role_depth: mode catalog lists roleDepth first for RoleAndDomainDepth; planner/context also promote when HasJob
  - legacy_interview_prep_service: not registered in DI (unchanged); MVP file left in tree for separate cleanup
  - adaptive_runtime: no code changes; existing runtime reads stored mode/persona strings

