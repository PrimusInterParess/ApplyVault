schema_version: "1.0.0"
envelope:
  task_id: "cv-builder-phase1-2026-07-29"
  parent_request: >-
    Improve blank CV builder per grilled decisions and ADR-0002 Phase 1:
    PDF upload on builder, Template fills saved Structured CV, returning users
    open edit; keep /my-cv for structure ops.
  assigned_agent: frontend-engineer
  objective: >-
    Implement Phase 1 CV builder entry/edit flows in applyvault-jobs-ui so the
    builder matches ADR-0002 without retiring /my-cv yet.
  scope:
    include_paths:
      - frontend/applyvault-jobs-ui/src/app/features/cv-projects/pages/cv-builder-page/
      - frontend/applyvault-jobs-ui/src/app/features/cv-projects/data-access/cv-document.facade.ts
      - frontend/applyvault-jobs-ui/src/app/features/cv-projects/ (only if required for upload UX helpers)
    exclude_paths:
      - api/
      - extension/
      - CONTEXT.md
      - docs/adr/
      - .agents/skills/
      - "**/*.spec.ts"
  contracts:
    must_respect:
      - docs/adr/0002-cv-builder-sole-surface.md
      - docs/adr/0001-cv-section-schema-catalog.md
      - CONTEXT.md (Template vs Blank CV vs PDF import vocabulary)
      - Existing CvDocumentFacade.upload / startBlankWithStarterSections APIs
  constraints:
    - Prefer project skills chain; user authorized implementation this session
    - No secrets in outputs
    - Do not claim tests passed without evidence
    - Do not add/modify test files (user No Automatic Tests)
    - Do not run ng build / npm install / full builds unless asked
    - Do not overwrite CONTEXT.md or ADRs
    - Do not retire /my-cv or port structure ops (Phase 2)
    - Phase 1 only
  definition_of_done:
    - Returning user with Structured CV opens builder in edit (last Template + their sections); gallery via Templates chip only
    - First visit (no Structured CV): after Template pick, peer actions Start blank AND Upload PDF
    - Existing Structured CV + choose Template: keep content, apply layout only (no blank wipe)
    - Start blank offered only when no Structured CV exists
    - Upload PDF available on pick and in edit chrome; if Structured CV exists, hard confirm then replace via existing upload API; on success enter edit with selected Template
    - Remove/replace the routerLink to /my-cv labeled Upload PDF with real upload on builder
    - Keep /my-cv reachable for structure ops (nav can still link there; do not delete page)
    - Handoff YAML returned to Architect
  dependencies: []
  handoff_required: true
  approval_gates: []
