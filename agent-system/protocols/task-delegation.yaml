schema_version: "1.0.0"
envelope:
  task_id: ""
  parent_request: ""
  assigned_agent: ""
  objective: ""
  scope:
    include_paths: []
    exclude_paths: []
  contracts:
    must_respect: []
  constraints:
    - Prefer project skills chain for implementation work
    - No secrets in outputs
    - Do not claim tests passed without evidence
    - Thin handoffs only under handoff_dir; probes/builds under scratch_dir
  definition_of_done: []
  dependencies: []
  handoff_required: true
  approval_gates: []
  # Required for /operate C/D — set per task
  scratch_dir: "agent-system/scratch/<TASK-ID>/"
  handoff_dir: "agent-system/handoffs/active/<TASK-ID>/"

instructions: |
  Fill one envelope per specialist Task. Inject agent purpose file + this envelope.
  In Cursor, launch native Task subagents; do not role-play all agents in one turn.
  Write thin YAML/MD handoffs under handoff_dir only.
  Put probes, builds, and disposable outputs under scratch_dir — never under handoffs/.
  After integration, Principal runs Close (protocols/task-close.yaml).
