<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV</title>
  <style>
    :root {
      --cv-page-pad-y: 16mm;
      --cv-page-pad-x: 18mm;
      --cv-ink: #1a1a1a;
      --cv-muted: #5c5c5c;
      --cv-rule: #d0d0d0;
      --cv-accent: #2f5d50;
      --cv-surface-soft: #f4f6f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Candara, Calibri, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--cv-ink);
      font-size: 10.5pt;
      line-height: 1.45;
    }
    .cv-classic {
      padding: var(--cv-page-pad-y) var(--cv-page-pad-x);
      max-width: 100%;
    }
    .cv-header {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 14pt;
      margin-bottom: 14pt;
      padding-bottom: 12pt;
      border-bottom: 1px solid var(--cv-accent);
    }
    .cv-photo {
      flex: 0 0 auto;
      width: 88px;
      height: 88px;
      object-fit: cover;
    }
    .cv-header-copy {
      flex: 1 1 auto;
      min-width: 0;
    }
    .cv-name {
      margin: 0;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-size: 22pt;
      font-weight: 700;
      line-height: 1.15;
      color: var(--cv-ink);
    }
    .cv-tagline {
      margin: 4px 0 8px;
      font-size: 11pt;
      color: var(--cv-muted);
    }
    .cv-contact {
      margin: 0;
    }
    .cv-contact-line {
      margin: 0 0 1px;
      font-size: 9.5pt;
      color: var(--cv-muted);
    }
    .cv-main {
      padding: 0;
      margin-top: 4pt;
    }
    .section { margin-bottom: 14pt; }
    .section-title {
      font-size: 9pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cv-accent);
      border-bottom: 1px solid var(--cv-rule);
      padding-bottom: 3px;
      margin: 0 0 10pt;
    }
    .entry { margin-bottom: 10pt; }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
    }
    .entry-title { font-size: 10.5pt; font-weight: 650; }
    .entry-date { font-size: 9.5pt; color: var(--cv-muted); }
    .entry-subtitle { font-style: italic; margin-top: 2px; color: var(--cv-muted); }
    .entry-summary { margin: 6px 0 0; }
    .entry-bullets { margin: 6px 0 0 1.1em; padding: 0; }
    .entry-bullets li { margin-bottom: 0.25em; }
    .entry-tech { font-size: 9.5pt; color: var(--cv-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="cv-classic">
    <header class="cv-header">
      {{ProfilePhotoHtml}}
      <div class="cv-header-copy">
        {{HeaderHtml}}
      </div>
    </header>
    <main class="cv-main">
      {{MainHtml}}
    </main>
  </div>
</body>
</html>
