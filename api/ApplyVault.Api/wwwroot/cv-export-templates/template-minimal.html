<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV</title>
  <style>
    :root {
      --cv-page-pad-y: 16mm;
      --cv-page-pad-x: 18mm;
      --cv-ink: #1a1a1a;
      --cv-muted: #5c5c5c;
      --cv-rule: #d0d0d0;
      --cv-accent: #2f5d50;
      --cv-surface-soft: #f4f6f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Gill Sans", "Trebuchet MS", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: var(--cv-ink);
      font-size: 10.5pt;
      line-height: 1.45;
    }
    .cv-body {
      padding: 18mm 20mm;
    }
    .cv-photo {
      width: 72px;
      height: 72px;
      object-fit: cover;
      float: right;
      border-radius: 4px;
      margin: 0 0 12pt 16pt;
    }
    .cv-name {
      margin: 0 0 6pt;
      font-size: 24pt;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.01em;
      color: var(--cv-ink);
    }
    .cv-name::after {
      content: '';
      display: block;
      width: 3rem;
      margin-top: 8pt;
      border-bottom: 1px solid var(--cv-rule);
    }
    .cv-tagline {
      margin: 0 0 8pt;
      font-size: 11pt;
      color: var(--cv-muted);
    }
    .cv-contact-line {
      margin: 0 0 1px;
      font-size: 9.5pt;
      color: var(--cv-muted);
    }
    .section { margin-bottom: 14pt; margin-top: 4pt; }
    .section-title {
      font-size: 8.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--cv-accent);
      border-bottom: 1px solid var(--cv-rule);
      padding-bottom: 3px;
      margin: 0 0 10pt;
    }
    .entry { margin-bottom: 12pt; }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
    }
    .entry-title { font-size: 10.5pt; font-weight: 650; }
    .entry-date { font-size: 9.5pt; color: var(--cv-muted); }
    .entry-subtitle { font-style: italic; margin-top: 2px; color: var(--cv-muted); }
    .entry-summary { margin: 6px 0 0; }
    .entry-bullets { margin: 6px 0 0 1.1em; padding: 0; }
    .entry-bullets li { margin-bottom: 0.25em; }
    .entry-tech { font-size: 9.5pt; color: var(--cv-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="cv-body">
    {{ProfilePhotoHtml}}
    {{MainHtml}}
  </div>
</body>
</html>
