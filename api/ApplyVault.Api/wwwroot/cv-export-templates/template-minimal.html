<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV</title>
  <style>
    :root {
      --cv-page-pad-y: 18mm;
      --cv-page-pad-x: 20mm;
      /* Slightly tighter than left pad; keeps photo on the right without hugging the edge. */
      --cv-page-pad-right: 16mm;
      --cv-ink: #1a1a1a;
      --cv-muted: #5c5c5c;
      --cv-rule: #d0d0d0;
      --cv-accent: #2f5d50;
      --cv-surface-soft: #f4f6f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Gill Sans", "Trebuchet MS", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: var(--cv-ink);
      font-size: 10.5pt;
      line-height: 1.45;
    }
    .cv-body {
      padding: var(--cv-page-pad-y) var(--cv-page-pad-right) var(--cv-page-pad-y) var(--cv-page-pad-x);
    }
    .cv-header {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12pt;
      margin-bottom: 20pt;
    }
    .cv-header-copy {
      flex: 1 1 auto;
      min-width: 0;
    }
    .cv-photo {
      flex: 0 0 auto;
      flex-shrink: 0;
      width: 168px;
      height: 168px;
      max-width: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 4px;
    }
    .cv-name {
      margin: 0 0 6pt;
      font-size: 24pt;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.01em;
      color: var(--cv-ink);
    }
    .cv-tagline {
      margin: 0 0 8pt;
      font-size: 11pt;
      color: var(--cv-muted);
    }
    .cv-contact {
      display: flex;
      flex-direction: column;
      gap: 3pt;
      align-items: flex-start;
      margin: 0;
    }
    .cv-contact-line {
      margin: 0;
      font-size: 9.5pt;
      color: var(--cv-muted);
    }
    .section { margin-bottom: 28pt; margin-top: 8pt; }
    .section-title {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      font-size: 8.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--cv-accent);
      border-bottom: 1px solid var(--cv-rule);
      padding-bottom: 3px;
      margin: 0 0 10pt;
    }
    .entry { margin-bottom: 12pt; }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
    }
    .entry-title { font-size: 10.5pt; font-weight: 650; }
    .entry-date { font-size: 9.5pt; color: var(--cv-muted); }
    .entry-subtitle { font-style: italic; margin-top: 2px; color: var(--cv-muted); }
    .entry-summary { margin: 6px 0 0; }
    .entry-bullets { margin: 6px 0 0 1.1em; padding: 0; }
    .entry-bullets li { margin-bottom: 0.25em; }
    .entry-tech { font-size: 9.5pt; color: var(--cv-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="cv-body">
    <header class="cv-header">
      <div class="cv-header-copy">
        {{HeaderHtml}}
      </div>
      {{ProfilePhotoHtml}}
    </header>
    {{MainHtml}}
  </div>
</body>
</html>
