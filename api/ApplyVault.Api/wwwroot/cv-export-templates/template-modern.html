<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CV</title>
  <style>
    :root {
      --cv-page-pad-y: 16mm;
      --cv-page-pad-x: 18mm;
      --cv-ink: #1a1a1a;
      --cv-muted: #5c5c5c;
      --cv-rule: #d0d0d0;
      --cv-accent: #2f5d50;
      --cv-surface-soft: #f4f6f5;
      --cv-sidebar-bg: #eef2f0;
      --cv-sidebar-ink: #1f2a26;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--cv-sidebar-ink);
      font-size: 10.5pt;
      line-height: 1.45;
    }
    .cv-layout {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .cv-sidebar {
      width: 34%;
      background: var(--cv-sidebar-bg);
      color: var(--cv-sidebar-ink);
      padding: 0;
      vertical-align: top;
    }
    .cv-main {
      width: 66%;
      background: #fff;
      padding: 0;
      vertical-align: top;
    }
    /* Padding lives on an inner block so print can clone it onto page 2+ fragments. */
    .cv-sidebar > .cv-page-pad {
      padding: 16mm 12mm 16mm 18mm;
    }
    .cv-main > .cv-page-pad {
      padding: 16mm 18mm 16mm 14mm;
    }
    .cv-photo {
      flex: 0 0 auto;
      flex-shrink: 0;
      width: 136px;
      height: 136px;
      max-width: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      display: block;
      margin-bottom: 14pt;
    }
    .cv-name {
      margin: 0 0 4px;
      font-size: 18pt;
      font-weight: 700;
      line-height: 1.15;
      color: var(--cv-sidebar-ink);
    }
    .cv-tagline {
      margin: 0 0 10pt;
      font-size: 10pt;
      color: var(--cv-muted);
    }
    .cv-contact-line {
      margin: 0 0 2px;
      font-size: 9.5pt;
      color: var(--cv-muted);
    }
    .section { margin-bottom: 14pt; }
    .section-title {
      font-size: 9pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-bottom: 1px solid rgba(47, 93, 80, 0.35);
      padding-bottom: 3px;
      margin: 0 0 10pt;
      color: var(--cv-accent);
    }
    .cv-main .section-title {
      color: var(--cv-accent);
      border-bottom: 1px solid var(--cv-rule);
    }
    .entry { margin-bottom: 10pt; }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cv-sidebar .entry-header { display: block; }
    .entry-title { font-size: 10.5pt; font-weight: 650; }
    .entry-date { font-size: 9.5pt; color: var(--cv-muted); }
    .entry-subtitle { font-size: 10pt; margin-top: 2px; color: var(--cv-muted); }
    .entry-summary { margin: 6px 0 0; line-height: 1.45; }
    .entry-bullets { margin: 6px 0 0 1.1em; padding: 0; }
    .entry-bullets li { margin-bottom: 0.25em; }
    .entry-tech { font-size: 9.5pt; margin: 4px 0 0; color: var(--cv-muted); }
    .cv-sidebar .entry-summary,
    .cv-sidebar .entry-tech { font-size: 9.5pt; }
  </style>
</head>
<body>
  <table class="cv-layout" role="presentation">
    <tbody>
      <tr>
        <td class="cv-sidebar">
          <div class="cv-page-pad">
            {{ProfilePhotoHtml}}
            {{SidebarHtml}}
          </div>
        </td>
        <td class="cv-main">
          <div class="cv-page-pad">
            {{MainHtml}}
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
