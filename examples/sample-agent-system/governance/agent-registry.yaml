agents:
  - id: principal-software-architect
    title: Principal Software Architect
    type: ORCHESTRATOR
    mission: Orchestrate the Sample Catalog API fleet, preserve contracts, and integrate handoffs.
    prompt_file: agents/00-principal-architect.md
    provider_scope: GENERIC
    primary_ownership:
      - architecture
      - delegation
      - integration-review
    supports: []
    consumes:
      - project-specification
      - shared-context
    produces:
      - task-delegation
      - integration-status
    invocation_conditions:
      - Every /operate request starts with this agent.
    exclusion_conditions:
      - Never acts as sole implementer or design author when architecture-engineer
        or backend-engineer is selected and Task is available.
    required_approvals:
      - user for provider and breaking contract decisions
    quality_gates:
      - ownership uniqueness
      - contract compatibility
    escalation_target: user

  - id: architecture-engineer
    title: Architecture Engineer
    type: SPECIALIST
    mission: Design and redesign Sample Catalog API structure and contracts for new or changed features.
    prompt_file: agents/architecture-engineer.md
    provider_scope: GENERIC
    primary_ownership:
      - architecture-design
      - architecture-redesign
      - structural-change-proposals
    supports:
      - principal-software-architect
      - backend-engineer
    consumes:
      - project-specification
      - shared-context
      - catalog-api-contract
      - task-delegation
    produces:
      - architecture-design-handoff
      - proposed-contract-updates
      - agent-handoff
    invocation_conditions:
      - Architecture design, redesign, or unsettled structural/contract choices are in scope.
    exclusion_conditions:
      - Pure routine coding with settled contracts and no structural change
      - UI/frontend work
      - Payment or identity provider integration
    required_approvals:
      - principal-software-architect for contract changes
      - user for provider and breaking contract decisions
    quality_gates:
      - evidence-based current state or explicit UNDECIDED
      - no invented providers
    escalation_target: principal-software-architect

  - id: backend-engineer
    title: Backend Engineer
    type: CORE
    mission: Implement and maintain the Sample Catalog API service within approved contracts.
    prompt_file: agents/backend-engineer.md
    provider_scope: GENERIC
    primary_ownership:
      - catalog-api-implementation
      - catalog-data-access
    supports:
      - principal-software-architect
      - architecture-engineer
    consumes:
      - catalog-api-contract
      - task-delegation
    produces:
      - api-code
      - agent-handoff
    invocation_conditions:
      - Catalog API or data-access work is in scope for the request.
    exclusion_conditions:
      - UI/frontend work
      - Payment or identity provider integration
    required_approvals:
      - principal-software-architect for contract changes
    quality_gates:
      - acceptance criteria met
      - no secrets committed
    escalation_target: principal-software-architect
